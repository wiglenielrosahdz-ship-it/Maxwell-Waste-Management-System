version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maxwell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxwell_user
      POSTGRES_PASSWORD: maxwell_password
      POSTGRES_DB: maxwell_waste_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxwell_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
